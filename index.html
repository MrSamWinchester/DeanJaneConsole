<body>
<div class="loader on" id="loader" aria-label="Loading"><span class="spin"></span></div>
<div class="app" id="app">

  <aside class="side">
    <button class="brand" id="homeBtn" aria-label="Dean Jane Console, go to Home">
      <i class="fa-brands fa-pied-piper" aria-hidden="true"></i>
      <span class="brand-t"><b>Dean Jane</b> <span>Console</span></span>
    </button>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-bottom">
      <div class="side-foot">
        <button class="folder" id="folderBtn" title="Choose or change folder"><i class="fa-solid fa-folder"></i><span id="folderName">Choose Folder</span></button>
        <button class="iconbtn sm" id="refreshBtn" aria-label="Refresh file list" title="Refresh file list"><i class="fa-solid fa-rotate"></i></button>
        <button class="iconbtn sm" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"><i class="fa-solid fa-sun"></i></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <label class="search">
        <span class="sr">Search</span>
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="search" id="search" placeholder="Search by Title, Album or Lyrics" autocomplete="off">
      </label>
    </div>

    <div class="head">
      <h1 id="title">Home</h1>
      <div class="head-r">
        <span class="count" id="count"></span>
        <div class="seg" id="sort" role="group" aria-label="Sort">
          <button data-sort="date" class="on">By Date</button>
          <button data-sort="name">By Name</button>
        </div>
      </div>
    </div>

    <div class="list" id="list"></div>

    <div class="player" id="player" hidden>
      <div class="p-left">
        <div class="p-cover" id="pcover"><i class="fa-solid fa-music"></i></div>
        <div class="p-meta"><span class="p-title" id="ptitle"></span><span class="p-sub" id="psub"></span></div>
      </div>
      <div class="p-ctl">
        <button class="iconbtn" id="pprev" aria-label="Previous"><i class="fa-solid fa-backward-step"></i></button>
        <button class="roundbtn" id="pplay" aria-label="Play"><i class="fa-solid fa-play"></i></button>
        <button class="iconbtn" id="pnext" aria-label="Next"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div class="p-seek">
        <span id="pcur">0:00</span>
        <input type="range" id="pseek" min="0" max="0" step="0.1" value="0" aria-label="Seek">
        <span id="ptotal">0:00</span>
      </div>
      <div class="p-right">
        <button class="iconbtn sm" id="pmute" aria-label="Mute"><i class="fa-solid fa-volume-high"></i></button>
        <input type="range" id="pvol" min="0" max="100" step="1" value="70" aria-label="Volume">
        <button class="iconbtn sm" id="pclose" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </main>

  <section class="detail" id="detail" aria-label="File details"></section>
  <div class="scrim" id="scrim"></div>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="fallback" webkitdirectory multiple hidden>
<script src="app.js"></script>
</body>
</html>
